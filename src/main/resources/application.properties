quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.category."io.quarkus".level=ERROR
quarkus.package.jar.type=uber-jar
# -Os: optimize for size (about 20% smaller executable, no measurable startup cost for this CLI)
quarkus.native.additional-build-args=--enable-url-protocols=https,-Os
quarkus.log.console.stderr=true
jandex-reader.jandex-version=@jandex.version@
