name: Build

on:
  push:
    branches: [main]
  pull_request:
  # manual run: also builds and uploads the native binaries, without releasing
  workflow_dispatch:
  # called by release.yml with the version to build
  workflow_call:
    inputs:
      version:
        description: Version to set in pom.xml before building
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MAVEN_ARGS: -B -ntp

jobs:
  jvm:
    name: JVM build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set release version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: mvn versions:set -DnewVersion="$VERSION"

      - name: Build and test
        run: mvn verify

      # Binaries are only uploaded for manual runs, releases included
      - name: Package
        if: github.event_name == 'workflow_dispatch'
        run: |
          cp target/*-runner.jar jandex-reader.jar
          java -jar jandex-reader.jar --version

      # uploaded as-is (not zipped): the artifact is named after the file
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          path: jandex-reader.jar
          archive: false
          if-no-files-found: error

  native:
    name: Native ${{ matrix.platform }}
    # manual runs, releases included (a called workflow sees the caller's event)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are built in the Mandrel builder container (UBI 9, glibc 2.34),
          # so they also run on distributions older than the runner.
          - platform: linux-amd64
            os: ubuntu-latest
            build-args: -Dquarkus.native.container-build=true
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            build-args: -Dquarkus.native.container-build=true
          - platform: macos-arm64
            os: macos-latest
          - platform: macos-amd64
            os: macos-15-intel
          - platform: windows-amd64
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Tests and, outside of Linux, the native-image compiler
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: 25
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Set release version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: mvn versions:set -DnewVersion="$VERSION"

      - name: Build native executable and run integration tests
        shell: bash
        run: mvn verify -Dnative ${{ matrix.build-args }}

      - name: Package
        id: package
        shell: bash
        run: |
          mkdir dist
          cp LICENSE README.md dist/
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/*-runner.exe dist/jandex-reader.exe
            dist/jandex-reader.exe --version
            archive="jandex-reader-${{ matrix.platform }}.zip"
            (cd dist && 7z a "../$archive" jandex-reader.exe LICENSE README.md)
          else
            cp target/*-runner dist/jandex-reader
            dist/jandex-reader --version
            archive="jandex-reader-${{ matrix.platform }}.tar.gz"
            tar -czf "$archive" -C dist jandex-reader LICENSE README.md
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      # uploaded as-is, not zipped again: the artifact is named after the .tar.gz/.zip file
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error
