# JReleaser configuration, used by jreleaser-maven-plugin (see pom.xml):
# https://jreleaser.org/guide/latest/reference/index.html
#
# Name, description, links, license, authors and inception year come from pom.xml.
# Binaries are built by the GitHub Actions matrix and downloaded into artifacts/ before
# mvn jreleaser:full-release runs.
project:
  longDescription: |
    Command line tool that checks whether JAR files, directories or Maven artifacts contain a
    Jandex index (META-INF/jandex.idx) and lets you browse its content: classes, members,
    annotations and type hierarchy.
  stereotype: CLI
  java:
    version: 21

release:
  github:
    owner: mcollovati
    name: jandex-reader
    # the tag is pushed by the maintainer and triggers the release workflow
    skipTag: true
    tagName: 'v{{projectVersion}}'
    releaseName: 'v{{projectVersion}}'
    overwrite: false
    prerelease:
      # versions with a suffix, such as 1.1.0-rc1
      pattern: '.*-.*'
    changelog:
      formatted: ALWAYS
      skipMergeCommits: true
      contributors:
        enabled: false
      hide:
        uncategorized: false

checksum:
  individual: false

distributions:
  jandex-reader:
    type: BINARY
    executable:
      name: jandex-reader
      windowsExtension: exe
    artifacts:
      - path: artifacts/jandex-reader-linux-amd64.tar.gz
        platform: linux-x86_64
      - path: artifacts/jandex-reader-linux-arm64.tar.gz
        platform: linux-aarch_64
      - path: artifacts/jandex-reader-macos-amd64.tar.gz
        platform: osx-x86_64
      - path: artifacts/jandex-reader-macos-arm64.tar.gz
        platform: osx-aarch_64
      - path: artifacts/jandex-reader-windows-amd64.zip
        platform: windows-x86_64

files:
  artifacts:
    # JVM uber-jar, runs with java -jar on Java 21+
    - path: artifacts/jandex-reader.jar
